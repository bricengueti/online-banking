# ======================
# Eureka - Test (Docker)
# ======================
eureka.instance.hostname=config-service
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90
eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/

# ======================
# Config Server - Test
# Les fichiers de config sont dans le classpath ET montés via volume Docker
# ======================
spring.cloud.config.server.native.search-locations=classpath:/config,file:/config

# ======================
# Logging
# ======================
logging.level.org.springframework.cloud.config=INFO
logging.level.com.netflix.eureka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ======================
# Actuator
# ======================
management.endpoints.web.exposure.include=health,info,metrics,prometheus