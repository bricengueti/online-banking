# ======================
# Eureka - Production (Docker)
# ======================
eureka.instance.hostname=config-service
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90
eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/

# ======================
# Config Server - Prod
# Les fichiers viennent d'un volume monté (pas du classpath)
# ======================
spring.cloud.config.server.native.search-locations=file:/config

# ======================
# Logging
# ======================
logging.level.org.springframework.cloud.config=WARN
logging.level.com.netflix.eureka=WARN
logging.file.name=/var/log/config/application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ======================
# Actuator
# ======================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=true