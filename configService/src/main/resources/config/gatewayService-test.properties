# ======================
# Application
# ======================
spring.application.name=gatewayService
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ─── Eureka ───────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ─── Gateway Routing ──────────────────────────────────────
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
# Route vers AuthService
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://authService
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
# Route vers AccountingService
spring.cloud.gateway.routes[1].id=accounting-service
spring.cloud.gateway.routes[1].uri=lb://accountingService
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/accounting/**

# ─── Actuator ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# ─── Swagger / SpringDoc ──────────────────────────────────
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/api/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=Accounting Service
springdoc.swagger-ui.urls[1].url=/api/accounting/v3/api-docs
springdoc.api-docs.groups.enabled=true

# ─── Logging ──────────────────────────────────────────────
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.netflix.eureka=INFO