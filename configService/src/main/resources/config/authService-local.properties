

# Application name for service registration
spring.application.name=authService

# Console log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server Configuration
# Port for local development
server.port=8081

# MongoDB Configuration - Local
# MongoDB host address
spring.data.mongodb.host=localhost

# MongoDB port
spring.data.mongodb.port=27017

# Database name for local environment
spring.data.mongodb.database=auth_db_local

# Authentication database
spring.data.mongodb.username=root
spring.data.mongodb.password=root
spring.data.mongodb.authentication-database=admin

# Eureka Client Configuration
# Service Discovery server URL
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Disable IP address preference for localhost
eureka.instance.prefer-ip-address=false

# Logging Configuration
# Debug level for application logs
logging.level.com.onlinebank.auth=DEBUG
# Debug level for Spring Security logs
logging.level.org.springframework.security=DEBUG

# =========================
# Swagger / OpenAPI
# =========================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Désactiver la redirection vers /error de Spring Security
server.error.path=/error
spring.mvc.throw-exception-if-no-handler-found=true

# JWT Configuration
# Secret key for JWT signing (minimum 32 characters for HS256)
app.jwt.secret=mySecretKeyForLocalDevelopment12345678901234567890
# JWT expiration time in milliseconds (1 hour = 3600000)
app.jwt.expiration=3600000
# Refresh token expiration time in milliseconds (7 days = 604800000)
app.jwt.refresh-expiration=604800000