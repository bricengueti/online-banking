# Application name for service registration
spring.application.name=accountingService

# Console log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server Configuration
server.port=8082

# MongoDB Configuration - Local
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=accounting_db_local
spring.data.mongodb.username=root
spring.data.mongodb.password=root
spring.data.mongodb.authentication-database=admin

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false

# Logging Configuration
logging.level.com.onlinebank.accountingService=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Désactiver la redirection vers /error de Spring Security
server.error.path=/error
spring.mvc.throw-exception-if-no-handler-found=true

# JWT Configuration
app.jwt.secret=mySecretKeyForLocalDevelopment12345678901234567890
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000
