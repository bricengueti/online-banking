# =========================
# Application
# =========================
spring.application.name=authService
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# =========================
# Server
# =========================
server.port=8081

# =========================
# MongoDB - Production (Docker)
# =========================
spring.data.mongodb.uri=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb-auth:27017/auth_db_prod?authSource=admin

# =========================
# Eureka - Production (Docker)
# =========================
eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# =========================
# Logging
# =========================
logging.level.com.onlinebank.auth=WARN
logging.level.org.springframework.security=WARN
logging.file.name=/var/log/auth/application.log

# =========================
# Swagger / OpenAPI — désactivé en prod
# =========================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# =========================
# Error handling
# =========================
server.error.path=/error
spring.mvc.throw-exception-if-no-handler-found=true

# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}