version: '3.8'

services:

  # ============================================================
  # MongoDB
  # ============================================================
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: admin
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "--username", "root", "--password", "root", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "9082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_ENABLED: "false"
      ME_CONFIG_SITE_BASEURL: "/"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - backend

  # ============================================================
  # Discovery Service (Eureka)
  # ============================================================
  service-discovery:
    build:
      context: ./discoveryService
      dockerfile: Dockerfile
    image: discovery-service:latest
    container_name: service-discovery
    restart: on-failure
    environment:
      PROFIL: test
    ports:
      - "8761:8761"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  # ============================================================
  # Config Service
  # ============================================================
  config-service:
    build:
      context: ./configService
      dockerfile: Dockerfile
    image: config-service:latest
    container_name: config-service
    restart: on-failure
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      PROFIL: test
      EUREKA_URL: http://service-discovery:8761/eureka/
    ports:
      - "8888:8888"
    volumes:
      # Volume pour les configs externes (profil test = classpath + file)
      - ./configService/src/main/resources/config:/config:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 50s
      retries: 5

  # ============================================================
  # Auth Service
  # ============================================================
  auth-service:
    build:
      context: .
      dockerfile: authService/Dockerfile
    image: auth-service:latest
    container_name: auth-service
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
      config-service:
        condition: service_healthy
    environment:
      PROFIL: test
      HOST_CONFIG: http://config-service
      EUREKA_URL: http://service-discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      MONGO_USER: root
      MONGO_PASSWORD: root
    ports:
      - "8081:8081"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/auth/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # ============================================================
  # Accounting Service
  # ============================================================
  accounting-service:
    build:
      context: .
      dockerfile: accountingService/Dockerfile
    image: accounting-service:latest
    container_name: accounting-service
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
      config-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      PROFIL: test
      HOST_CONFIG: http://config-service
      EUREKA_URL: http://service-discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      MONGO_USER: root
      MONGO_PASSWORD: root
    ports:
      - "8082:8082"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/api/accounting/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # ============================================================
  # Gateway Service
  # ============================================================
  gateway-service:
    build:
      context: ./gatewayService
      dockerfile: Dockerfile
    image: gateway-service:latest
    container_name: gateway-service
    restart: on-failure
    depends_on:
      config-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      accounting-service:
        condition: service_healthy
    environment:
      PROFIL: test
      HOST_CONFIG: http://config-service
      EUREKA_URL: http://service-discovery:8761/eureka/
    ports:
      - "8080:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  mongo_data: