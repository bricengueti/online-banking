# src/main/resources/application-prod.properties
spring.config.activate.on-profile=prod

# Port
server.port=8761

# Configuration Eureka - Production (Docker)
eureka.instance.hostname=service-discovery
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90
eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/

# Configuration serveur optimisée pour production
eureka.server.enable-self-preservation=true
eureka.server.renewal-percent-threshold=0.85
eureka.server.eviction-interval-timer-in-ms=60000
eureka.server.response-cache-auto-expiration-in-seconds=30
eureka.server.use-read-only-response-cache=true

# Logging niveau WARN pour production
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
logging.file.name=/var/log/discovery/application.log

# Actuator sécurisé pour production
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=true